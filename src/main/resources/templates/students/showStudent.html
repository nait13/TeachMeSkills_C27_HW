<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Top Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<h1 th:text="${title}">Top 3 Students by Group</h1>

<div class="container" th:each="entry : ${topStudentsByGroup}">
    <h2 th:text="${entry.key}"></h2>
    <table class="table table-bordered ">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Rating</th>
        </tr>
        <tr th:each="student : ${entry.value}">
            <td class="align-middle" th:text="${student.id}"></td>
            <td class="align-middle" th:text="${student.name}"></td>
            <td class="align-middle" th:text="${student.age}"></td>
            <td class="align-middle" th:text="${student.recordBook.rating}"></td>
        </tr>
    </table>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>
</html>
