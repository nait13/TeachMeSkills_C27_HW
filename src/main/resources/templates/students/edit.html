<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" >
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Update student</title>
    <style>
        body{
            height: 100vh;
        }
        .invalid-feedback {
            display: block;
            width: 100%;
            margin-top: 0.25rem;
            font-size: 80%;
            color: #dc3545;
        }
        .is-invalid {
            border-color: #dc3545;
            padding-right: calc(1.5em + 0.75rem);
            background-repeat: no-repeat;
            background-position: center right calc(0.375em + 0.1875rem);
            background-size: calc(0.75em + 0.375rem) calc(0.75em + 0.375rem);
        }

        .bloc-center {
            padding: 50px;
            position: fixed; top: 50%; left: 50%;
            -webkit-transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
<section th:class="section">
    <div class="container">
        <div class="row">
            <div class="container container--xs">
                <div class="woocommerce">
                    <div id="signup_div_wrapper" class="bloc-center">
                        <h3 class="mb-1 text-center">Update student from TMS C27</h3>
                        <form th:method="PATCH" th:action="@{/student/{id}(id = ${student.getId()})}" th:object="${student}" class="register row g-3 shadow-sm">
                            <div class="col-md-6" >
                                <label for="name">First Name <span class="required">*</span></label>
                                <input type="text" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" class="input-text form-control" name="name" id="name" value="">
                                <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="invalid-feedback">ERROR!</div>
                            </div>

                            <div class="col-md-6">
                                <label for="surname">Last Name <span class="required">*</span></label>
                                <input type="text" th:field="*{surname}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" class="input-text form-control" name="surname" id="surname" value="">
                                <div th:if="${#fields.hasErrors('surname')}" th:errors="*{surname}" class="invalid-feedback">This field is required</div>
                            </div>

                            <div class="form-row form-row-wide">
                                <label for="github">GitHub <span class="required">*</span></label>
                                <input type="url" th:field="*{github}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" class="input-text form-control" name="github" id="github" value="">
                                <div th:if="${#fields.hasErrors('github')}" th:errors="*{github}" class="invalid-feedback">This field is required</div>
                            </div>

                            <div class="form-row">
                                <input type="submit" class="btn btn-primary btn-block btn-sm mb-4 mt-3 border " style="margin:0;" name="register" value="uppdate">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
